</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

    <div class="wrap bar">
      <a class="brand" href="index.html" aria-label="HandaPH home"><img src="images/logo.svg" alt="" width="46" height="52"><span>Handa<b>PH</b></span></a>

      <ul>
        <li><a href="index.html">Home</a></li>

        <li><a href="about.html">About and Help</a></li>
      </ul>
      </nav>
      <form class="search" role="search" action="hazards.html">
        <img src="images/search.svg" alt="">
        <input type="search" name="q" placeholder="Search..." aria-label="Search the site">
      </form>
    </div>
  </header>
  <main id="main">
    <div class="wrap">
      <div class="page-head"><h1 class="section-title">Family Emergency Plan</h1></div>
      <div class="plan-grid" style="margin-top:22px">
        <section class="plan-card" aria-labelledby="c-h">
          <h2 id="c-h">Emergency Contacts <span aria-hidden="true">&rarr;</span></h2>
          <form action="#" method="get">
            <div class="field"><label for="c-name">Name</label><input type="text" id="c-name" name="name" autocomplete="off"></div>
            <div class="field"><label for="c-rel">Relationship</label><input type="text" id="c-rel" name="relationship" autocomplete="off"></div>
            <div class="field"><label for="c-tel">Phone Number</label><input type="tel" id="c-tel" name="phone" inputmode="tel" placeholder="09XX XXX XXXX"></div>
            <div class="field"><label for="c-mail">Email Address</label><input type="email" id="c-mail" name="email"></div>
            <button class="btn" type="submit">Add Contact <span aria-hidden="true">&rarr;</span></button>
          </form>
        </section>
        <section class="plan-card" aria-labelledby="e-h">
          <h2 id="e-h">Evacuation Meeting Points <span aria-hidden="true">&rarr;</span></h2>
          <form action="#" method="get">
            <div class="map-box"><img src="images/map.svg" alt="Sample map with a primary and a secondary meeting point" width="400" height="220"></div>
            <div class="field"><label for="e-addr">Address</label><input type="text" id="e-addr" name="address" placeholder="Street, barangay, city"></div>
            <div class="field"><label for="e-desc">Description</label><textarea id="e-desc" name="description" placeholder="Description for planning evacuation."></textarea></div>
            <button class="btn" type="submit">Save Point <span aria-hidden="true">&rarr;</span></button>
          </form>
        </section>
        <section class="plan-card" aria-labelledby="m-h">
          <h2 id="m-h">Household Member Details <span aria-hidden="true">&rarr;</span></h2>
          <form action="#" method="get">
            <div class="field"><label for="m-name">Name</label><input type="text" id="m-name" name="member" autocomplete="off"></div>
            <div class="field"><label for="m-age">Age</label><input type="number" id="m-age" name="age" min="0" max="120" placeholder="Age"></div>
            <div class="field"><label for="m-notes">Special Needs/Notes</label><textarea id="m-notes" name="notes"></textarea></div>
            <div class="upload">
              <input type="file" id="m-photo" name="photo" accept="image/*">
              <label for="m-photo"><span class="box" aria-hidden="true">&#8679;</span></label>
              <label for="m-photo">Upload Photo</label>
            </div>
            <button class="btn" type="submit">Add Member <span aria-hidden="true">&rarr;</span></button>
          </form>
        </section>
      </div>
    </div>
  </main>

    </div>
  </footer>
</body>
</html>
